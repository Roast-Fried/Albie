name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # GitHub Actions free tier 의 artifact storage (500 MB) 초과 방지.
  # main push 시 본 repo 의 최신 2 개 artifact 만 유지하고 나머지 삭제.
  # (storage 재계산이 6-12h 라 즉시 효과는 없으나 누적 방지 효과.)
  cleanup-old-artifacts:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      actions: write
    steps:
      - name: Delete old artifacts (keep latest 2)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/${{ github.repository }}/actions/artifacts --paginate \
            --jq '.artifacts | sort_by(.created_at) | reverse | .[2:] | .[].id' \
            | while read id; do
              echo "Deleting artifact $id"
              gh api -X DELETE repos/${{ github.repository }}/actions/artifacts/$id || true
            done

  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test --reporter expanded --exclude-tags golden

  build-apk:
    runs-on: ubuntu-latest
    needs: analyze-and-test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: 'stable'
          cache: true

      - name: Create local.properties
        run: |
          mkdir -p android
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=$ANDROID_HOME" >> android/local.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (debug)
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: albi-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 3

  build-ios:
    runs-on: macos-latest
    needs: analyze-and-test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS (no codesign)
        run: flutter build ios --no-codesign --debug

      - name: Upload iOS build
        uses: actions/upload-artifact@v4
        with:
          name: albi-ios-build
          path: build/ios/iphoneos/Runner.app
          retention-days: 3
