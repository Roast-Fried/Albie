name: Release

# tag push (v*) 시 자동으로 Android APK + iOS unsigned Release 자산을
# 직접 GitHub Release 에 업로드.
#
# 2026-05-27: 기존 publish job + actions/upload-artifact@v4 패턴이 free tier
# storage quota (500MB) 초과로 fail. artifact 우회 — 각 job 이 빌드 직후
# softprops/action-gh-release@v2 로 직접 release 에 append.
#
# iOS 는 unsigned (`--no-codesign`) — Apple Developer 계정 없이 빌드만.
# 일반 iPhone 직접 설치 불가, Xcode/Sideloadly 같은 sideload 도구 필요.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write  # Release create/upload

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: 'stable'
          cache: true

      - name: Create local.properties
        run: |
          mkdir -p android
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=$ANDROID_HOME" >> android/local.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (debug)
        run: flutter build apk --debug

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: build/app/outputs/flutter-apk/app-debug.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS (no codesign, debug)
        run: flutter build ios --no-codesign --debug

      - name: Package Runner.app
        run: |
          cd build/ios/iphoneos
          zip -r Runner.app.zip Runner.app
          ls -lh Runner.app.zip

      - name: Upload iOS to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            자동 빌드 — CI Release (Android + iOS unsigned)

            ## 설치 방법
            ### Android
            1. `app-debug.apk` 다운로드
            2. 설정 → '알 수 없는 출처 설치' 허용
            3. APK 실행 → 설치

            ### iOS (unsigned)
            Apple Developer 계정 없이 빌드된 `Runner.app.zip` 이라 일반 iPhone
            직접 설치 불가. Xcode/Sideloadly 같은 sideload 도구로 본인 device 에
            install. TestFlight 배포는 별도 workflow + Apple Developer Program
            가입 필요.
          files: build/ios/iphoneos/Runner.app.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
