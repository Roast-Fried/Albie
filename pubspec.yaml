name: albi
description: "알비 - 자연어 음주 기록 앱"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  sqflite: ^2.4.2
  path: ^1.9.1
  shared_preferences: ^2.3.4
  flutter_secure_storage: ^9.2.4
  dio: ^5.7.0
  intl: ^0.20.2
  cross_file: ^0.3.4+2
  image_picker: ^1.1.2
  sqflite_common_ffi: ^2.3.4+4
  fl_chart: ^0.68.0
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4
  permission_handler: ^11.3.1
  flutter_dotenv: ^5.1.0
  table_calendar: ^3.1.2
  supabase_flutter: ^2.5.0
  # Drift 격리 데모 모듈 (컨디션 로그) — 기존 sqflite 메인 DB와 분리된 reactive ORM 시연
  drift: ^2.20.0
  drift_flutter: ^0.2.0
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Drift 코드 생성 (.g.dart 는 git 커밋 — CI 는 build_runner 미실행)
  drift_dev: ^2.20.0
  build_runner: ^2.4.0
  # 아이콘/스플래시 생성
  flutter_launcher_icons: ^0.14.0
  flutter_native_splash: ^2.4.0

# 런처 아이콘 생성 설정 (dart run flutter_launcher_icons)
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/branding/app_icon.png"
  adaptive_icon_background: "#15110D"
  adaptive_icon_foreground: "assets/branding/app_icon_foreground.png"
  min_sdk_android: 21
  remove_alpha_ios: true

# 스플래시 생성 (dart run flutter_native_splash:create)
flutter_native_splash:
  color: "#FBF6EE"
  color_dark: "#15110D"
  image: "assets/branding/splash_logo.png"
  android_12:
    color: "#FBF6EE"
    color_dark: "#15110D"
    image: "assets/branding/splash_logo.png"
  android: true
  ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/seed/
    - .env
  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Regular.otf
          weight: 400
        - asset: assets/fonts/Pretendard-Medium.otf
          weight: 500
        - asset: assets/fonts/Pretendard-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Pretendard-Bold.otf
          weight: 700
