name: albi
description: "알비 - 자연어 음주 기록 앱"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  sqflite: ^2.4.2
  path: ^1.9.1
  shared_preferences: ^2.3.4
  flutter_secure_storage: ^9.2.4
  dio: ^5.7.0
  intl: ^0.20.2
  cross_file: ^0.3.4+2
  image_picker: ^1.1.2
  sqflite_common_ffi: ^2.3.4+4
  fl_chart: ^0.68.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/seed/
  fonts:
    - family: NotoSansKR
      fonts:
        - asset: assets/fonts/NotoSansKR.ttf
